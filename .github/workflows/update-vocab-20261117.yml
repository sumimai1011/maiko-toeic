name: Update photographed TOEIC vocabulary

on:
  push:
    paths:
      - '.github/workflows/update-vocab-20261117.yml'
      - 'scripts/increase_daily_study_to_30.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Increase daily study volume to 30 cards and verify 289
        run: python3 scripts/increase_daily_study_to_30.py
      - name: Commit updated index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "No new entries to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase daily practice to at least 30 cards while preserving review history"
          git push
