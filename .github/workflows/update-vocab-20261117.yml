name: Update photographed TOEIC vocabulary

on:
  push:
    paths:
      - '.github/workflows/update-vocab-20261117.yml'
      - 'scripts/remove_learned_10_batch2.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Remove ten approved learned cards and verify 381
        run: python3 scripts/remove_learned_10_batch2.py
      - name: Commit updated index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "No new entries to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove ten approved learned cards and verify 381 remaining"
          git push
