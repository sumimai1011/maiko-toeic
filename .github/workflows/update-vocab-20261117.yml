name: Update photographed TOEIC vocabulary
on:
  push:
    paths:
      - '.github/workflows/update-vocab-20261117.yml'
      - 'scripts/add_evening_notes_20261126.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add approved cards and check duplicates
        run: python3 scripts/add_evening_notes_20261126.py
      - name: Commit updated index.html
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add approved evening vocabulary and consolidate duplicates"
          git push
