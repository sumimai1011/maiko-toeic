          +      <div class="pointSection"><h3>接続詞の後ろの省略</h3><p>if / when などの接続詞の後ろは通常 <strong>S + V</strong>。ただし、主節と従属節の主語が同じで、従属節が <strong>S + be</strong> の形なら、<strong>主語 + be動詞</strong>を省略できる。</p><div class="pointNote">例：When (it is) completed, the form will be sent by email.</div></div>
