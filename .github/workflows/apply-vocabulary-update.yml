name: Apply vocabulary update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-vocabulary-update.yml

permissions:
  contents: write

jobs:
  update-vocabulary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add vocabulary cards
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          marker = 'const PKEY="word-point-progress-v10";'
          block = r'''BASE.push(
            {"type":"熟語","front":"in light of ～","meaning":"～を考慮して、～に照らして","example":"In light of the latest sales figures, we revised our plan.","image":"","id":"s371"},
            {"type":"単語","front":"legislation","meaning":"法律、法令、立法","example":"The new legislation will take effect next month.","image":"","id":"s372","note":"※ 名詞"},
            {"type":"単語","front":"restoration","meaning":"修復、復元","example":"The restoration of the historic building took two years.","image":"","id":"s373","note":"※ 名詞"},
            {"type":"熟語","front":"fossil fuel","meaning":"化石燃料","example":"The company aims to reduce its use of fossil fuels.","image":"","id":"s374"},
            {"type":"単語","front":"substitute","meaning":"代用品、代理人","example":"We need to find a substitute for the damaged part.","image":"","id":"s375","note":"※ 名詞としての用法。substitute for ～＝～の代用品・代理人"},
            {"type":"単語","front":"disruption","meaning":"混乱、遮断","example":"A network disruption affected online orders.","image":"","id":"s376","note":"※ 名詞"},
            {"type":"単語","front":"confectionery","meaning":"菓子店、菓子類","example":"She opened a small confectionery near the station.","image":"","id":"s377","note":"※ 名詞。綴りは confectionery"},
            {"type":"単語","front":"formally","meaning":"正式に、公式に","example":"The agreement will be formally announced tomorrow.","image":"","id":"s378","note":"※ 副詞"},
            {"type":"単語","front":"stringent","meaning":"厳格な、厳しい","example":"The factory must meet stringent safety standards.","image":"","id":"s379"},
            {"type":"単語","front":"yet","meaning":"しかし、それでも、～でありながら","example":"The design is simple yet elegant.","image":"","id":"s380","note":"※ simple yet elegant＝シンプルでありながら上品な"},
            {"type":"単語","front":"state","meaning":"州","example":"The company operates in several states.","image":"","id":"s381","note":"※ 名詞。この用法では米国などの「州」"},
            {"type":"熟語","front":"be committed to ~ing","meaning":"～することに尽力している、固く決意している","example":"We are committed to providing excellent service.","image":"","id":"s382","note":"※ to は前置詞なので、後ろは名詞または動名詞"},
            {"type":"熟語","front":"advertise on a website / in a newspaper","meaning":"ウェブサイトで／新聞に広告を出す","example":"The company advertised the position on its website and in a local newspaper.","image":"","id":"s383","note":"※ 電子媒体には on、紙媒体には in を使う"},
            {"type":"単語","front":"engagement","meaning":"約束、予定","example":"I cannot attend the meeting because of a prior engagement.","image":"","id":"s384","note":"※ 名詞。文脈により「婚約」「関与」の意味もある"},
            {"type":"単語","front":"name","meaning":"名付ける、任命する、名前を挙げる","example":"The board named Ms. Sato as the new director.","image":"","id":"s385","note":"※ 動詞としての用法"},
            {"type":"単語","front":"commitment","meaning":"約束、献身、責任ある取り組み","example":"The project requires a long-term commitment from everyone.","image":"","id":"s386"},
            {"type":"単語","front":"committee","meaning":"委員会","example":"The committee will review the proposal next week.","image":"","id":"s387"},
            {"type":"熟語","front":"be in deliberations","meaning":"審議中である、協議中である","example":"The committee is in deliberations over the final proposal.","image":"","id":"s388"},
            {"type":"熟語","front":"be delighted","meaning":"喜んでいる、うれしく思う","example":"We are delighted to welcome you to our team.","image":"","id":"s389"},
            {"type":"単語","front":"delightful","meaning":"楽しい、喜ばしい、すてきな","example":"We had a delightful evening at the reception.","image":"","id":"s390"},
            {"type":"単語","front":"throughout","meaning":"～の間ずっと、～の至る所に","example":"The store will remain open throughout the holiday season.","image":"","id":"s391"}
          );
          '''
          if '"id":"s371"' not in text:
              if marker not in text:
                  raise SystemExit("Insertion marker not found")
              path.write_text(text.replace(marker, block + marker, 1), encoding="utf-8")
          Path(".github/workflows/apply-vocabulary-update.yml").unlink()
      - name: Commit update
        shell: bash
        run: |
          git config user.name "sumimai1011"
          git config user.email "159740289+sumimai1011@users.noreply.github.com"
          git add index.html .github/workflows/apply-vocabulary-update.yml
          git commit -m "Add vocabulary cards from handwritten notes"
          git push
